[package]
name = "uiua-compiler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "uiuac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
itertools = "0.15.0"
thiserror = "2.0.20"

ron = "0.12.2"
serde = "1.0.229"

inkwell = { version = "0.10.0", features = ["llvm22-1"] }
llvm-sys = "211.0.0-rc1"
petgraph = "0.8.3"

uiua = { git = "https://github.com/uiua-lang/uiua" }
